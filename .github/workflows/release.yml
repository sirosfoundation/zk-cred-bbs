# Release — Android AAR, UniFFI bindings, browser package.
#
# Mirrors zk-cred-vega's release.yml. The AAR is what the native SDKs
# actually consume (`org.siros:zk-cred-bbs:<version>` from GitHub
# Packages), the same way they consume zk-cred-longfellow today.
#
# The AAR is consumed by siros-sdk-kotlin from GitHub Packages; the
# XCFramework is attached to the GitHub Release and consumed by
# siros-sdk-swift, which is how the other ZK crates ship theirs.
name: Release

on:
  push:
    tags: ["v*"]
  # Lets the packaging path be exercised without cutting a tag. The release
  # job below is tag-only, so a manual run builds and uploads workflow
  # artifacts without touching any GitHub Release.
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # Single source of truth for the NDK the artifacts are built against.
  # Bump deliberately: native artifacts are not reproducible across NDK
  # versions.
  NDK_VERSION: "27.3.13750724"

jobs:
  # Catches tagging vX.Y.Z while Cargo.toml still says something else,
  # which would otherwise publish a Maven artifact whose version disagrees
  # with the crate it was built from.
  version-check:
    name: Check tag matches Cargo.toml
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compare
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          CARGO_VERSION=$(cargo metadata --no-deps --format-version 1 \
            | python3 -c "import sys,json; print(json.load(sys.stdin)['packages'][0]['version'])")
          echo "tag=$TAG_VERSION cargo=$CARGO_VERSION"
          if [ "$TAG_VERSION" != "$CARGO_VERSION" ]; then
            echo "::error::Tag v$TAG_VERSION does not match Cargo.toml version $CARGO_VERSION"
            exit 1
          fi

  bindings:
    name: Generate bindings
    runs-on: ubuntu-latest
    # Gated on version-check, which it was not: that job's failure used to
    # skip only Create Release, so a tag pointing at the wrong commit still
    # published artifacts to GitHub Packages and npm. The guard protected
    # the least consequential output and none of the ones consumers pull.
    #
    # always() is needed because version-check is tag-only - on
    # workflow_dispatch it is skipped, and a plain `needs` would skip this
    # too, taking away the manual packaging run this workflow exists to
    # allow. Skipped is fine; failed is not.
    needs: version-check
    if: ${{ always() && needs.version-check.result != 'failure' }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - run: make bindings-kotlin bindings-swift
      - uses: actions/upload-artifact@v4
        with:
          name: bindings
          path: bindings/

  # ── iOS / XCFramework (macOS runner, Xcode toolchains) ────────────
  ios:
    name: Build XCFramework
    runs-on: macos-latest
    needs: bindings
    env:
      IPHONEOS_DEPLOYMENT_TARGET: "16.0"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim,x86_64-apple-ios
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      # Reuse the bindings job's output rather than regenerating: the
      # XCFramework's headers come from the SAME generation the Swift
      # sources do, so the two cannot disagree about the FFI surface.
      - uses: actions/download-artifact@v4
        with:
          name: bindings
          path: bindings/
      - run: make xcframework
      - name: Package XCFramework
        run: |
          cd target
          zip -qr zk_cred_bbs.xcframework.zip zk_cred_bbs.xcframework
      - uses: actions/upload-artifact@v4
        with:
          name: xcframework
          path: target/zk_cred_bbs.xcframework.zip

  android:
    name: Build AAR
    runs-on: ubuntu-latest
    needs: bindings
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - name: Install cargo-ndk
        run: cargo install cargo-ndk
      # setup-android takes no api-level/ndk-version inputs — passing them
      # is silently ignored, leaving the build on whatever NDK the runner
      # image happens to ship, which can drift under us. Install the NDK
      # explicitly and point cargo-ndk at that exact one.
      - uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4
        with:
          packages: "ndk;${{ env.NDK_VERSION }}"
      - name: Pin cargo-ndk to the installed NDK
        run: |
          NDK_HOME="${ANDROID_SDK_ROOT:-$ANDROID_HOME}/ndk/${NDK_VERSION}"
          test -d "$NDK_HOME" || { echo "::error::NDK not found at $NDK_HOME"; exit 1; }
          echo "ANDROID_NDK_HOME=$NDK_HOME" >> "$GITHUB_ENV"
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - uses: actions/download-artifact@v4
        with:
          name: bindings
          path: bindings/
      # On a tag the tag is authoritative (version-check has confirmed it
      # agrees with Cargo.toml). A manual run has no tag, so fall through to
      # the Makefile's own cargo-metadata default.
      - name: Derive package version from tag
        if: startsWith(github.ref, 'refs/tags/')
        run: echo "PKG_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
      - name: Build AAR
        run: make aar ${PKG_VERSION:+VERSION=$PKG_VERSION}
      - name: Generate Maven POM
        run: make pom ${PKG_VERSION:+VERSION=$PKG_VERSION}
      - name: Publish AAR to GitHub Packages
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cat > /tmp/settings.xml <<'EOF'
          <settings>
            <servers>
              <server>
                <id>github</id>
                <username>${env.GITHUB_ACTOR}</username>
                <password>${env.GITHUB_TOKEN}</password>
              </server>
            </servers>
          </settings>
          EOF
          AAR=$(ls target/zk_cred_bbs-*.aar)
          POM=$(ls target/zk-cred-bbs-*.pom)
          mvn -B deploy:deploy-file \
            --settings /tmp/settings.xml \
            -DrepositoryId=github \
            -Durl="https://maven.pkg.github.com/${GITHUB_REPOSITORY}" \
            -DpomFile="$POM" \
            -Dfile="$AAR" \
            -Dpackaging=aar
      - uses: actions/upload-artifact@v4
        with:
          name: aar
          path: |
            target/zk_cred_bbs-*.aar
            target/zk-cred-bbs-*.pom

  wasm:
    name: Build browser package
    runs-on: ubuntu-latest
    # Gated on version-check, which it was not: that job's failure used to
    # skip only Create Release, so a tag pointing at the wrong commit still
    # published artifacts to GitHub Packages and npm. The guard protected
    # the least consequential output and none of the ones consumers pull.
    #
    # always() is needed because version-check is tag-only - on
    # workflow_dispatch it is skipped, and a plain `needs` would skip this
    # too, taking away the manual packaging run this workflow exists to
    # allow. Skipped is fine; failed is not.
    needs: version-check
    if: ${{ always() && needs.version-check.result != 'failure' }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          targets: wasm32-unknown-unknown
      - uses: jetli/wasm-pack-action@0d096b08b4e5a7de8c28de67e11e945404e9eefa # v0.4.0
        with:
          version: latest
      - run: make wasm
      - uses: actions/upload-artifact@v4
        with:
          name: wasm-pkg
          path: pkg/

  release:
    name: Create Release
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    needs: [version-check, bindings, ios, android, wasm]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: aar
          path: artifacts/
      - uses: actions/download-artifact@v4
        with:
          name: bindings
          path: artifacts/bindings/
      - uses: actions/download-artifact@v4
        with:
          name: wasm-pkg
          path: artifacts/wasm-pkg/
      - uses: actions/download-artifact@v4
        with:
          name: xcframework
          path: artifacts/
      - name: Package bindings and wasm
        run: |
          cd artifacts
          zip -qr bindings.zip bindings/
          zip -qr zk-cred-bbs-wasm.zip wasm-pkg/
          rm -rf bindings wasm-pkg
      - name: Create Release
        uses: softprops/action-gh-release@c12583777ecdfd3be55c69cf75464299dc01057e # v3
        with:
          generate_release_notes: true
          # The warning belongs on every release, not just the first: this
          # implements a pre-standardisation construction against
          # placeholder identifiers, with no independent review.
          body: |
            > **Not reviewed, not for production.** This implements a
            > construction that is explicitly pre-standardisation, against
            > COSE identifiers that are explicitly placeholders, and it has
            > had no independent cryptographic review. See `PROFILE.md`.
          files: artifacts/*
