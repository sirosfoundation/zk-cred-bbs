name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Test, format, lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          components: rustfmt, clippy
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Clippy (uniffi)
        run: cargo clippy --all-targets --features uniffi -- -D warnings
      # The keygen CLI is behind a feature, so --all-targets alone never
      # compiles it. Without this it would rot unnoticed until an operator
      # needed a key.
      - name: Clippy (keygen CLI)
        run: cargo clippy --all-targets --features cli -- -D warnings
      - name: Test
        run: cargo test --all-targets

  # The C header is hand-written. Rust asserts every constant at compile
  # time; this catches drift in the other direction.
  header:
    name: C header drift
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check header matches go_ffi.rs
        run: make check-go-header

  # Exercises the real staticlib from Go against the reference vectors —
  # the ABI vc will use. An ABI nobody compiles is an ABI nobody can trust.
  go-cabi:
    name: Go C ABI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
      - name: Build C ABI and run the Go smoke test
        run: make go-smoketest

  bindings:
    name: UniFFI bindings
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - name: Regenerate and check for staleness
        run: make check-bindings

  wasm:
    name: Browser package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          targets: wasm32-unknown-unknown
      - uses: jetli/wasm-pack-action@0d096b08b4e5a7de8c28de67e11e945404e9eefa # v0.4.0
        with:
          version: latest
      - name: Build the wasm package
        run: make wasm
      - name: Check the expected entry points are exported
        run: |
          for fn in commitInit commitFinalize verifyBlindSign \
                    blindProofGenInit blindProofGenFinalize blindProofVerify \
                    jwpCommittedMessages jwpInspect jwpAccept jwpPresentInit \
                    jwpPresentFinalize jwpVerify jwpBuildPresentationHeader; do
            grep -q "export function $fn" pkg/zk_cred_bbs.js \
              || { echo "missing export: $fn"; exit 1; }
          done
      # The grep above catches a renamed or dropped binding and nothing
      # else - a package whose wasm fails to instantiate exports exactly
      # the same symbols. This loads it and computes with it.
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Run the built package
        run: node tests/wasm_smoke.mjs
      # A rehearsal of what the release job does, so a publish cannot fail
      # on packaging at tag time - when the tag is already pushed and the
      # other artifacts are already out.
      - name: Rehearse the npm packaging
        run: |
          cd pkg
          jq '.version = "0.0.0-ci"
              | .name = "@sirosfoundation/zk-cred-bbs-wasm"
              | .publishConfig = {"access": "public"}' \
            package.json > tmp.json && mv tmp.json package.json
          npm pack --dry-run
          test -f zk_cred_bbs_bg.wasm && test -f zk_cred_bbs.d.ts
