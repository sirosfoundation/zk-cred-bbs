sonar.projectKey=sirosfoundation_zk-cred-bbs
sonar.organization=sirosfoundation

sonar.sources=src,tools,go-cabi-smoketest
sonar.tests=tests

# `test-vectors/` is generated data, not code.
#
# It holds the values a cryptographic conformance suite is made of, and
# some of them are secret keys BY CONSTRUCTION: a signing test needs a
# signing key, and a blind-issuance test needs the holder's
# `secret_prover_blind`. They are derived from fixed seeds, published
# deliberately, and belong to no one - `emlun_reference.json` has carried
# an issuer `sk` since the first commit and is the reference this crate is
# tested against.
#
# Excluded rather than annotated because there is nothing in there for a
# static analyser to usefully say anything about: no code, and every byte
# regenerated by `make sdk-fixture` or the dump script in PROFILE.md §5.
sonar.exclusions=test-vectors/**
