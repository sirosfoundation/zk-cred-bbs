sonar.projectKey=sirosfoundation_zk-cred-bbs
sonar.organization=sirosfoundation

sonar.sources=src,tools,go-cabi-smoketest
sonar.tests=tests

# Published test vectors are not secrets.
#
# `test-vectors/` holds the values a cryptographic conformance suite is made
# of, and some of them are secret keys BY CONSTRUCTION: a signing test needs
# a signing key, and a blind-issuance test needs the holder's
# `secret_prover_blind`. They are generated from fixed seeds, published
# deliberately, and belong to no one - `test-vectors/emlun_reference.json`
# has carried an issuer `sk` since the first commit.
#
# Scoped to the secrets rule on that one directory rather than excluding the
# directory outright, so anything else the analysis finds there is still
# reported. A blanket exclusion is how a real finding ends up unread.
sonar.issue.ignore.multicriteria=e1
sonar.issue.ignore.multicriteria.e1.ruleKey=json:S6418
sonar.issue.ignore.multicriteria.e1.resourceKey=test-vectors/**/*
