[package]
name = "zk-cred-bbs"
version = "0.0.6"
edition = "2024"
license = "BSD-2-Clause"
description = "Blind BBS signatures with hardware key binding, for wallet credentials"
repository = "https://github.com/sirosfoundation/zk-cred-bbs"

[features]
uniffi = ["dep:uniffi"]
wasm = ["dep:wasm-bindgen", "dep:js-sys", "getrandom/wasm_js"]

[dependencies]
bls12_381_plus = "0.9"
sha2 = "0.10"
# preserve_order: cmap key order must round-trip, and the issuer header
# octets are the BBS `header` input - see src/jwp.rs.
serde_json = { version = "1", features = ["preserve_order"] }
getrandom = "0.4"
uniffi = { version = "0.32.0", optional = true, features = ["cli"] }
wasm-bindgen = { version = "0.2", optional = true }
js-sys = { version = "0.3", optional = true }

[dev-dependencies]
hex = "0.4"
num-bigint = "0.5.1"
serde_json = "1.0"

[lib]
crate-type = ["cdylib", "rlib", "staticlib"]

[[bin]]
name = "bbs-keygen"
path = "src/bin/bbs-keygen.rs"

[[bin]]
name = "uniffi-bindgen"
path = "src/bin/uniffi-bindgen.rs"
required-features = ["uniffi"]
