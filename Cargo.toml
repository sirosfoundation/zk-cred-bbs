[package]
name = "zk-cred-bbs"
version = "0.0.1"
edition = "2024"
license = "BSD-2-Clause"
description = "Blind BBS signatures with hardware key binding, for wallet credentials"

[dependencies]
bls12_381_plus = "0.9"
group = "0.13"
ff = "0.13"
sha2 = "0.10"
subtle = "2.5"
getrandom = "0.4.3"

[dev-dependencies]
hex = "0.4"
serde_json = "1.0.151"
